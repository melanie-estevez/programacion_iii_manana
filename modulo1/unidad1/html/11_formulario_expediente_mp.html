<!DOCTYPE html>
<hatml>
    <head>
        <title>RentaCar</title>
        <link rel="icon" href="img/iconoR.png" type="image/png" sizes="16x16">
    </head>
    <body bgcolor="#CCC9ED">
        <h1><center>Bienvenido a RentaCar</center></h1>
        <p><center><i>Alquilar un vehiculo nunca fue tan facil</i></center></p>
        <form action="procesar.php" method="post">
            <table border="0" bgcolor="#EDECF9">
                <h4>Formulario de Servicio RentaCar</h4>
                <tr>
                    <th>
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre">
                    </th>
                    <th>
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido">
                    </th>
                    <th>
                        <label for="correo">Email</label>
                        <input type="email" id="correo" name="correo">
                    </th>
                </tr>
                <tr>
                    <th>
                        <label for="proceso">Proceso</label>
                        <input type="radio" id="retiro" name="proceso" value="retiro">
                        <label for="retiro">Retiro</label>
                        <input type="radio" id="devolucion" name="proceso" value="devolucion">
                        <label for="devolucion">Devolucion</label>
                    </th>
                    <th>
                        <label for="ciudad">Ciudad</label>
                        <select id="ciudad" name="ciudad">
                            <option value="">Seleccione ...</option>
                            <option value="quito">Quito</option>
                            <option value="Guayaquil">Guayaquil</option>
                            <option value="Cuenca">Cuenca</option>
                        </select>
                    </th>
                    <th>
                        <label for="fecha">Fecha</label>
                        <input type="date" id="fecha" name="fecha">
                    </th>
                </tr>
                <tr>
                    <th>
                        <label for="requerimiento">Requerimiento</label>
                        <textarea id="requerimiento" name="requerimiento" rows="4" cols="15"></textarea>
                    </th>
                    <th>
                        <label for="color">Color del Vehiculo</label>
                        <input type="color" id="color" name="color">
                    </th>
                </tr>
                <tr>
                    <th>
                        <input type="checkbox" id="acepto" name="acepto" required>
                        <label for="acepto">Acepto los terminos y condiciones</label>
                    </th>
                </tr>
            </table>
            <br>
            <input type="submit" value="Enviar">
            <input type="reset"  value="Limpiar">
        </form>
    </body>
</hatml>
