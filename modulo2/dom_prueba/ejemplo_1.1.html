<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="ejemplo_1.1.css">
    </head>
    <body>
        <h1>Ejercicio 1: Calcular área de un rectángulo</h1>
        <p>Introduce el ancho y el alto del rectángulo. Luego, calcula el área</p>
        <div class="caja">
            <h3>Ancho: </h3>
            <input type="number" id="Ancho" placeholder="Escribe el ancho">
            <h3>Alto: </h3>
            <input type="number" id="Alto" placeholder="Escribe el alto">
            <br>
            <button onclick=calcularArea()>Calcular área</button>
            <p id="resultado"></p>
        </div>
    </body>
    <script src="ejemplo_1.1.js"></script>
</html>
